name: Testy

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit do przetestowania (domyślnie bieżący)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  jednostkowe:
    name: Testy jednostkowe i danych
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  strona:
    name: Testy strony w przeglądarce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
      - name: Zapisz raport z nieudanych testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-playwright
          path: test-results/
          retention-days: 7
