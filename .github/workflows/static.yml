# Wdrożenie strony na GitHub Pages — tylko jeśli testy przejdą.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit do wdrożenia (domyślnie bieżący)
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  testy:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: testy
    # Nie przerywamy trwającego wdrożenia; czekające starsze są pomijane (nowszy commit zawiera ich zmiany).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
