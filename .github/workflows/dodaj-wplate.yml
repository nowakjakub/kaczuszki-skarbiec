# Ręczne dopisanie wpłaty / nieobecności do otwartej zbiórki — bez edycji plików.
# Actions → „Dodaj wpłatę” → Run workflow. Uruchomić może tylko właściciel repozytorium.
name: Dodaj wpłatę

on:
  workflow_dispatch:
    inputs:
      zbiorka:
        description: 'Zbiórka — nazwa lub jej fragment, np. "rada", "kwiaty", "składka"'
        required: true
        type: string
      numery:
        description: 'Numery dzieci z dziennika, np. 3, 7, 12'
        required: true
        type: string
      rodzaj:
        description: 'Co zapisać (wplata / nieobecnosc / cofnij — usuwa wpłatę lub nieobecność)'
        required: true
        type: choice
        default: wplata
        options:
          - wplata
          - nieobecnosc
          - cofnij

permissions:
  contents: read

jobs:
  zapisz:
    name: Zapisz w collections.json
    if: github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dane-zbiorek
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zapisz zmianę
        id: zmiana
        env:
          ZBIORKA: ${{ inputs.zbiorka }}
          NUMERY: ${{ inputs.numery }}
          RODZAJ: ${{ inputs.rodzaj }}
        run: node scripts/dodaj-wplate.mjs
      - name: Testy danych
        run: npm test
      - name: Commit i push na master
        id: push
        env:
          MESSAGE: ${{ steps.zmiana.outputs.commit_message }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collections.json
          git commit -m "$MESSAGE" -m "Zapisane przez workflow „Dodaj wpłatę” (uruchomił: $ACTOR)."
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Push wykonany tokenem GITHUB_TOKEN nie uruchamia innych workflowów, więc wdrażamy tutaj.
  wdrozenie:
    name: Wdrożenie strony
    needs: zapisz
    uses: ./.github/workflows/static.yml
    with:
      ref: ${{ needs.zapisz.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
