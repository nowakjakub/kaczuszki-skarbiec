# Zamknięcie zbiórki (+ opcjonalnie wydatek). Uruchomić może tylko właściciel repozytorium.
name: Zamknij zbiórkę

on:
  workflow_dispatch:
    inputs:
      zbiorka:
        description: 'Numer zbiórki (sprawdź w workflow „Lista zbiórek”)'
        required: true
        type: string
      wydatek_kwota:
        description: 'Wydatek w zł, np. 294 — opcjonalnie (puste = bez wydatku)'
        required: false
        type: string
      wydatek_opis:
        description: 'Opis wydatku — opcjonalnie (domyślnie nazwa zbiórki bez terminu)'
        required: false
        type: string
      wydatek_data:
        description: 'Data wydatku DD.MM.RRRR — opcjonalnie (domyślnie dziś)'
        required: false
        type: string
      mimo_zaleglosci:
        description: 'Zamknij mimo zaległości (ktoś nie zapłacił i nie ma zgłoszonej nieobecności)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zapisz:
    name: Zamknij w collections.json
    if: github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dane-zbiorek
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.zapis.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zamknij zbiórkę
        id: zmiana
        env:
          ZBIORKA: ${{ inputs.zbiorka }}
          WYDATEK_KWOTA: ${{ inputs.wydatek_kwota }}
          WYDATEK_OPIS: ${{ inputs.wydatek_opis }}
          WYDATEK_DATA: ${{ inputs.wydatek_data }}
          MIMO_ZALEGLOSCI: ${{ inputs.mimo_zaleglosci }}
        run: node scripts/zamknij-zbiorke.mjs
      - name: Testy danych
        run: npm test
      - name: Commit i push na master
        id: zapis
        uses: ./.github/actions/zapisz-na-master
        with:
          message: ${{ steps.zmiana.outputs.commit_message }}

  wdrozenie:
    name: Wdrożenie strony
    needs: zapisz
    uses: ./.github/workflows/static.yml
    with:
      ref: ${{ needs.zapisz.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
