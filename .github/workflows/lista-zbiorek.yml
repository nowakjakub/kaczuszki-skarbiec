# Pokazuje otwarte zbiórki z numerami (w podsumowaniu uruchomienia). Niczego nie zmienia.
name: Lista zbiórek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lista:
    name: Otwarte zbiórki
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lista-zbiorek.mjs
